apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-green
  labels:
    app: taskflow
    color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      color: green
  template:
    metadata:
      labels:
        app: taskflow
        color: green
    spec:
      containers:
        - name: taskflow-api
          image: localhost:5001/taskflow-api:bootstrap
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
