apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-blue
  labels:
    app: taskflow
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      color: blue
  template:
    metadata:
      labels:
        app: taskflow
        color: blue
    spec:
      containers:
        - name: taskflow-api
          image: localhost:5001/taskflow-api:bootstrap
          # ชั่วคราว: จำลอง config ผิดพลาดที่ทำให้ deploy สีนี้พังเฉพาะใน cluster จริง (ไม่กระทบ
          # docker-compose ที่ใช้ตอน E2E) สำหรับสาธิต automatic rollback ของ Lab 07 task 6
          # ต้องเอาออกทันทีหลังสาธิตเสร็จ
          env:
            - name: CRASH_ON_START
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
